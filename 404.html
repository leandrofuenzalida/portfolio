<!DOCTYPE html>
<!--
  404.html
  ========
  Página personalizada para URLs inexistentes en GitHub Pages.

  No contiene contenido principal del portafolio y no debe aparecer
  en sitemap.xml.
-->
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | Nombre Apellido</title>
  <!--
    noindex evita que esta página de error sea tratada como resultado SEO.
  -->
  <meta name="robots" content="noindex,follow">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >
</head>
<body>
  <!--
    La 404 debe hacer dos cosas:
    1. explicar que la URL no existe;
    2. ofrecer una salida clara hacia el portafolio.
  -->
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="text-center col-lg-7">
      <p class="display-1 fw-bold mb-0">404</p>
      <h1 class="h2">Página no encontrada</h1>
      <p class="text-body-secondary">
        La dirección no existe o el contenido fue movido.
      </p>
      <!--
        Usamos una URL absoluta para que el enlace funcione aunque la 404
        se muestre desde una ruta anidada.
      -->
      <a class="btn btn-primary" href="https://TU_USUARIO.github.io/portfolio/">
        Volver al portafolio
      </a>
    </section>
  </main>
</body>
</html>
